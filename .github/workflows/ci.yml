name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  NEXT_PUBLIC_API_BASE_URL: http://localhost:8000/api/v1
  NEXT_PUBLIC_GOOGLE_AUTH_ENABLED: "false"
  NEXT_PUBLIC_MICROSOFT_AUTH_ENABLED: "false"
  NEXT_PUBLIC_UMAMI_ENABLED: "false"
  NEXT_PUBLIC_UMAMI_WEBSITE_ID: ""
  NEXT_PUBLIC_ANALYTICS_DEBUG: "false"
  NEXT_PUBLIC_OPENREPLAY_ENABLED: "false"
  NEXT_PUBLIC_OPENREPLAY_PROJECT_KEY: ""
  NEXT_PUBLIC_OPENREPLAY_INGEST_URL: ""
  NEXT_PUBLIC_OPENREPLAY_SAMPLE_RATE: "0"
  NEXT_PUBLIC_OPENREPLAY_ALLOW_LOCALHOST: "false"
  NEXT_PUBLIC_CONVERSATION_DEBUG: "false"
  NEXT_PUBLIC_OPTIMIZATION_DEBUG: "false"

jobs:
  frontend-checks:
    name: frontend-checks
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Run frontend tests
        run: |
          npm run test:qa
          npm run test:import
          npm run test:conversation-capacity
          npm run test:new-optimization-session
          npm run test:strategy
          npm run test:validation
          npm run test:analytics
          npm run test:auth-credentials
          npm run test:replay-privacy

      - name: Production build
        run: npm run build

  frontend-secret-scan:
    name: frontend-secret-scan
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Scan tracked files for likely committed secrets
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          import subprocess
          import sys

          patterns = {
              "private_key": re.compile(r"-----BEGIN (?:RSA |OPENSSH |EC |DSA )?PRIVATE KEY-----"),
              "openai_key": re.compile(r"sk-[A-Za-z0-9_-]{20,}"),
              "google_api_key": re.compile(r"AIza[0-9A-Za-z_-]{20,}"),
              "aws_access_key": re.compile(r"AKIA[0-9A-Z]{16}"),
              "jwt": re.compile(r"eyJ[A-Za-z0-9_-]{20,}\.[A-Za-z0-9_-]{20,}\.[A-Za-z0-9_-]{10,}"),
          }
          files = subprocess.check_output(["git", "ls-files"], text=True).splitlines()
          findings = []
          for name in files:
              path = Path(name)
              if not path.is_file():
                  continue
              text = path.read_text(encoding="utf-8", errors="ignore")
              matched = [key for key, pattern in patterns.items() if pattern.search(text)]
              if matched:
                  findings.append((name, matched))
          if findings:
              for name, matched in findings:
                  print(f"Potential secret pattern in {name}: {', '.join(matched)}")
              sys.exit(1)
          print("No likely committed secrets found in tracked files.")
          PY
